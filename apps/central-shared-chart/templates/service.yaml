apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.appName }}
  # FIX: Allow ArgoCD to override or explicitly pass the release fallback
  namespace: {{ .Release.Namespace | quote }} 
  labels:
    app: {{ .Values.global.appName }}
spec:
  # This pattern forces Helm to check both flat and nested definitions cleanly
  type: {{ .Values.serviceType | default .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.containerPort | default 8080 }}
      protocol: TCP
  selector:
    app: {{ .Values.global.appName | default .Values.serviceName }}