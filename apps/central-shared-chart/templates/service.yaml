apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}
  namespace: production
  labels:
    app: {{ .Values.serviceName }}
spec:
  type: {{ .Values.serviceType | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 8080 }}
      targetPort: {{ .Values.containerPort | default 8080 }}
      protocol: TCP
  selector:
    app: {{ .Values.serviceName }}