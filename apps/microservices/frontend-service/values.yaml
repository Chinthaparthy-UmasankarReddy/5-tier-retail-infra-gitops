global:
  appName: retail-app

serviceName: frontend-service
replicaCount: 2

image:
  repository: umasankar33/5-retail-app-frontend
  tag: latest

# 1. Flat override to bypass nesting quirks
serviceType: LoadBalancer

# 2. Standard nested block
service:
  port: 80
  type: LoadBalancer

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"