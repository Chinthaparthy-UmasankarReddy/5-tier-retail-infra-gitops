global:
  appName: login-service-app

# FIX: Ensured fields map correctly to the template interpreter
service:
  type: ClusterIP
  port: 8081
  targetPort: 8080  # Ensure this matches the exact casing expected by your shared chart template

image:
  repository: umasankar33/5-retail-app-source-login-service
  tag: latest
  pullPolicy: Always

persistence:
  enabled: true
  storageClass: gp3
  size: 1Gi
  mountPath: /app/logs

env:
  PORT: "8080"      # This explicitly binds the container inner system to 8080
  NODE_ENV: "production"

resources:
  limits: { cpu: "500m", memory: "512Mi" }
  requests: { cpu: "250m", memory: "256Mi" }