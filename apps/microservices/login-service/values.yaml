global:
  appName: login-service-app

# FIX: This block was missing, which triggered the Helm compilation error
service:
  type: ClusterIP
  port: 8081
  targetPort: 8080

image:
  repository: umasankar33/5-retail-app-login
  tag: latest
  pullPolicy: Always

# If your central-shared-chart supports stateful/persistence variables, define them here:
persistence:
  enabled: true
  storageClass: gp3
  size: 1Gi
  mountPath: /app/logs

env:
  PORT: "8080"
  NODE_ENV: "production"