apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-storefront-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - http:
      paths:
      # 1. Route to Catalog Service App
      - path: /api/v1/catalog/?(.*)
        pathType: Prefix
        backend:
          service:
            name: catalog-service-app
            port:
              number: 8082

      # 2. Route to Login/Auth Service App
      - path: /api/v1/auth/?(.*)
        pathType: Prefix
        backend:
          service:
            name: login-service-app
            port:
              number: 8081

      # 3. Route to Cards Service App
      - path: /api/v1/cards/?(.*)
        pathType: Prefix
        backend:
          service:
            name: cards-service-app
            port:
              number: 8083

      # 4. Route to Orders Service App
      - path: /api/v1/orders/?(.*)
        pathType: Prefix
        backend:
          service:
            name: orders-service-app
            port:
              number: 8084

      # 5. Route to Payment Service App
      - path: /api/v1/payment/?(.*)
        pathType: Prefix
        backend:
          service:
            name: payment-service-app
            port:
              number: 8085

      # 6. Default Route to Frontend UI LoadBalancer Service
      - path: /?(.*)
        pathType: Prefix
        backend:
          service:
            name: retail-ui-lb
            port:
              number: 80