apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-frontend
  namespace: production
  labels:
    infra.layer: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-ui-pod
  template:
    metadata:
      labels:
        app: retail-ui-pod
    spec:
      containers:
        - name: web-nginx
          image: umasankar33/5-retail-app-frontend:v18
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: retail-ui-lb
  namespace: production
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: retail-ui-pod