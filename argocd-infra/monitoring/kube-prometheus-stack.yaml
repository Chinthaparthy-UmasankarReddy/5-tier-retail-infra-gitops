apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: standalone-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus # Standard standalone prometheus (NOT the stack)
    targetRevision: 25.x.x
    helm:
      values: |
        # Turn off everything except the server
        alertmanager: { enabled: false }
        prometheus-node-exporter: { enabled: false }
        kube-state-metrics: { enabled: false }
        prometheus-pushgateway: { enabled: false }
        server:
          persistentVolume: { enabled: false } # Keeps it fast and memory-only
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]