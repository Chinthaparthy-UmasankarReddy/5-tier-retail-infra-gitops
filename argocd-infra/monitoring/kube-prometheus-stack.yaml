apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 48.x.x
    helm:
      values: |
        # 1. DISABLE ALL KUBERNETES CONTROL PLANE ARCHITECTURE SCRAPERS
        kubeApiServer: { enabled: false }
        kubelet: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        kubeEtcd: { enabled: false }
        coreDns: { enabled: false }
        nodeExporter: { enabled: false }
        kubeStateMetrics: { enabled: false }

        # 2. STRIP OUT DEFAULT ALERTS & PRE-BAKED SYSTEM RULES
        defaultRules:
          create: false # Turns off the massive list of 'PR' rules cluttering your logs

        # 3. KEEP ONLY CORE TELEMETRY ENGINES
        prometheus:
          enabled: true
          prometheusSpec:
            # Tells Prometheus to discover custom ServiceMonitors in the production namespace
            serviceMonitorSelectorNilUsesHelixLimits: false
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack

        grafana:
          enabled: true # Keeps your visual dashboard tier active
          
        alertmanager:
          enabled: false # Disables default notification alertmanager structures