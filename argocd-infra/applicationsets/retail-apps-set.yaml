apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: retail-microservices
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
        revision: dev
        directories:
          - path: apps/microservices/*
  template:
    metadata:
      name: '{{path.basename}}-app'
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
          targetRevision: dev
          path: apps/central-shared-chart
          helm:
            valueFiles:
              - '$git-repo/apps/microservices/{{path.basename}}/values.yaml'
        - repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
          targetRevision: dev
          ref: git-repo
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # FIX: Forces ArgoCD to successfully establish the namespace BEFORE creating manifests
          - CreateNamespace=true