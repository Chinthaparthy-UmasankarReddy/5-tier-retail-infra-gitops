apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: retail-microservices
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
        revision: dev  # FIXED: Tells the generator to scan the file tree on the dev branch
        directories:
          - path: apps/microservices/* 
  template:
    metadata:
      name: '{{path.basename}}-app'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
        targetRevision: dev  # FIXED: Tells ArgoCD to pull the Helm configs from the dev branch
        path: '{{path}}' 
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: production 
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true