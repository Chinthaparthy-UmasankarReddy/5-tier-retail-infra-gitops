apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: retail-app-sa
      containers:
      - name: payment-engine
        image: umasankar33/retail-app-source-payment-test:1
        ports:
        - containerPort: 8085
        env:
        - name: PORT
          value: "8085"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: retail-prod
spec:
  ports:
  - port: 8085
    targetPort: 8085
  selector:
    app: payment-service
  type: ClusterIP