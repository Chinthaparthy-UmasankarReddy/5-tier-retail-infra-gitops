apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: retail-prod
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Catch the hardcoded browser path and route it to the correct Go service endpoint
        location /api/v1/catalog {
            proxy_pass http://retail-db-service.retail-prod.svc.cluster.local:5432; 
            # Wait! The Go app is catalog-service:8082, let's target that accurately:
            proxy_pass http://catalog-service.retail-prod.svc.cluster.local:8082/api/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
