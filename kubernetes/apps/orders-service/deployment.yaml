apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      serviceAccountName: retail-app-sa
      containers:
      - name: orders-engine
        image: umasankar33/retail-app-source-orders-test:1
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 15"] # Gives the App Load Balancer 15 seconds to stop routing new traffic here while active connections finish
        ports:
        - containerPort: 8084
        env:
        - name: SERVER_PORT
          value: "8084"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://retail-db-service:5432/retail_storefront"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: retail-shared-config
              key: DB_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: retail-secure-vault
              key: password
        resources:
          requests:
            cpu: "400m"
            memory: "512Mi"
          limits:
            cpu: "800m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8084
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: retail-prod
spec:
  ports:
  - port: 8084
    targetPort: 8084
  selector:
    app: orders-service
  type: ClusterIP
