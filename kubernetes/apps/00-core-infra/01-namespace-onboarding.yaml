apiVersion: v1
kind: Namespace
metadata:
  name: retail-prod
  labels:
    environment: production
    team: retail-devops
    managed-by: argocd
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: retail-compute-quota
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: retail-default-limits
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      # Tweaked down slightly for smooth local scheduling inside Docker/WSL2
      cpu: "100m"  
      memory: "128Mi"