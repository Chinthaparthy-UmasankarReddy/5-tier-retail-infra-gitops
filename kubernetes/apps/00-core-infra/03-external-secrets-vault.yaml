apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1 # Deploys directly targeting your AWS Bangalore infrastructure grid
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa #retail-app-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: retail-secure-vault-sync
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1h" # Automatically pulls updated keys from AWS if rotated
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: retail-secure-vault # This is the exact native secret target name your deployments extract
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: prod/retail/db
      property: password
  - secretKey: JWT_SECRET
    remoteRef:
      key: prod/retail/auth
      property: jwt_signing_key
  - secretKey: CARDS_SECRET_KEY
    remoteRef:
      key: prod/retail/crypto
      property: aes_gcm_key