apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    webhook:
      url: "http://172.17.0.1:4566/"
      method: POST
      headers:
        # FIX 1: Wrap header keys in single quotes to stop Kubernetes from breaking 'Content-Type' into 'Content - Type'
        'X-Amz-Target': "secretsmanager.GetSecretValue"
        'Content-Type': "application/x-amz-json-1.1"
      body: '{"SecretId": "{{ .remoteRef.key }}"}'
      result:
        # FIX 2: Wrapped the jsonPath string in quotes and updated the filter expression.
        # Floci returns AWS Secrets Manager payloads as a JSON string under "SecretString". 
        # Since your secrets are stored as key-value maps (e.g., {"password":"..."}), 
        # we pull the string wrapper cleanly so the ExternalSecret can extract the inner properties.
        jsonPath: "$.SecretString"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: retail-secure-vault-sync
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: retail-secure-vault
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: prod/retail/db
      property: password
  - secretKey: JWT_SECRET
    remoteRef:
      key: prod/retail/auth
      property: jwt_signing_key
  - secretKey: CARDS_SECRET_KEY
    remoteRef:
      key: prod/retail/crypto
      property: aes_gcm_key