# =========================================================================
# POLICY 1: DEFAULT DENY-ALL ALL TRAFFIC (THE ZERO-TRUST BASELINE)
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# =========================================================================
# POLICY 2: ALLOW CORE DNS OUTBOUND (REQUIRED FOR INTERNAL CALLS TO WORK)
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-dns
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# =========================================================================
# POLICY 3: FRONTEND ENTRYPOINT POLICY (ALLOWS INTERNET INGRESS)
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: frontend-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {} # Unblocks access from ingress controller node layers locally
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: catalog-service
    - podSelector:
        matchLabels:
          app: login-service
    - podSelector:
        matchLabels:
          app: cards-service
    - podSelector:
        matchLabels:
          app: orders-service
    - podSelector:
        matchLabels:
          app: payment-service
---
# =========================================================================
# POLICY 4: RESTRICT BACKEND SERVICES (ALLOWS TRAFFIC ONLY FROM FRONTEND)
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-only-from-frontend
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchExpressions:
    - { key: app, operator: In, values: [catalog-service, login-service, cards-service, orders-service, payment-service] }
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend-service
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: retail-db
---
# =========================================================================
# POLICY 5: SECURE DATABASE FIREWALL (ONLY ALLOW CATALOG & ORDERS)
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-isolation-policy
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: retail-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: catalog-service
    - podSelector:
        matchLabels:
          app: orders-service
    ports:
    - protocol: TCP
      port: 5432