apiVersion: v1
kind: ServiceAccount
metadata:
  name: retail-app-sa
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # IRSA: Connects your EKS Pod token identity natively to your cloud AWS IAM role boundary
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/EKS-Retail-Application-Execution-Role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retail-namespace-reader
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "create", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retail-identity-binding
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
- kind: ServiceAccount
  name: retail-app-sa
  namespace: retail-prod
roleRef:
  kind: Role
  name: retail-namespace-reader
  apiGroup: rbac.authorization.k8s.io