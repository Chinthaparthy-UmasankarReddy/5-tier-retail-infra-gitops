apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-platform-ingress
  namespace: retail-prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik # Points directly to k3s default ingress handler
  rules:
  - http:
      paths:
      # 1. KEEP THIS: Routes the web portal UI assets
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      # 2. ADD THIS: Routes the backend transaction calls to the Go binary
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 8082