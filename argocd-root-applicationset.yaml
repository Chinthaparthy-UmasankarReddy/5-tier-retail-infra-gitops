apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: retail-platform-appset
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
        revision: main
        directories:
          - path: 'kubernetes/apps/*'
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      # FIX: Changed from 'default' to your locked-down production AppProject framework
      project: default #retail-devops-project 
      source:
        repoURL: 'https://github.com/Chinthaparthy-UmasankarReddy/5-tier-retail-infra-gitops.git'
        targetRevision: main
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: retail-prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true